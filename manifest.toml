#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "qui"
name = "Qui"
description.en = "qBittorrent web UI"
description.fr = "Interface utilisateur Web qBittorrent"

version = "1.36.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-2.0"
website = "https://getqui.com/"
admindoc = "https://getqui.com/docs/intro"
code = "https://github.com/autobrr/qui"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
     in_subdir = false
    amd64.url = "https://github.com/autobrr/qui/releases/download/v1.36.1/qui_1.36.1_linux_x86_64.tar.gz"
    amd64.sha256 = "a5627b48cf48978df1a8f24d2744a9e2707677a8565ecf09f491a6b195abf711"
    arm64.url = "https://github.com/autobrr/qui/releases/download/v1.36.1/qui_1.36.1_linux_arm64.tar.gz"
    arm64.sha256 = "9b9d87d7ed38ff1a03b1a1f026533ffa485cc662d8a39a63fc0c50472e00b3ec"
    armhf.url = "https://github.com/autobrr/qui/releases/download/v1.36.1/qui_1.36.1_linux_x86_64.tar.gz"
    armhf.sha256 = "a5627b48cf48978df1a8f24d2744a9e2707677a8565ecf09f491a6b195abf711"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.armhf = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
