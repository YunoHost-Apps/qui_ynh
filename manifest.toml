#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "qui"
name = "Qui"
description.en = "qBittorrent web UI"
description.fr = "Interface utilisateur Web qBittorrent"

version = "1.33.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-2.0"
website = "https://getqui.com/"
admindoc = "https://getqui.com/docs/intro"
code = "https://github.com/autobrr/qui"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
     in_subdir = false
    amd64.url = "https://github.com/autobrr/qui/releases/download/v1.33.1/qui_1.33.1_linux_x86_64.tar.gz"
    amd64.sha256 = "d92854ae026fb552ddb5ced852a8fddabc5a10e2973558d34410f3fe856393b7"
    arm64.url = "https://github.com/autobrr/qui/releases/download/v1.33.1/qui_1.33.1_linux_arm64.tar.gz"
    arm64.sha256 = "c6d90c9b0d4c96ba8c976a1460c02c4f9b00566879b1c1d7a6aac22cef1429c0"
    armhf.url = "https://github.com/autobrr/qui/releases/download/v1.33.1/qui_1.33.1_linux_x86_64.tar.gz"
    armhf.sha256 = "d92854ae026fb552ddb5ced852a8fddabc5a10e2973558d34410f3fe856393b7"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.armhf = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
