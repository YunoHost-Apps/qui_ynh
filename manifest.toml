#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "qui"
name = "Qui"
description.en = "qBittorrent web UI"
description.fr = "Interface utilisateur Web qBittorrent"

version = "1.37.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-2.0"
website = "https://getqui.com/"
admindoc = "https://getqui.com/docs/intro"
code = "https://github.com/autobrr/qui"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
     in_subdir = false
    amd64.url = "https://github.com/autobrr/qui/releases/download/v1.37.0/qui_1.37.0_linux_x86_64.tar.gz"
    amd64.sha256 = "189193cc015a1cd026e19c9beeb55dc99183ece13b556d5d2ddb18bb6f6684c8"
    arm64.url = "https://github.com/autobrr/qui/releases/download/v1.37.0/qui_1.37.0_linux_arm64.tar.gz"
    arm64.sha256 = "1751d736fe54b780167191be54093cd11204ce4a89fa436df3e3b6ebfd7c93ec"
    armhf.url = "https://github.com/autobrr/qui/releases/download/v1.37.0/qui_1.37.0_linux_x86_64.tar.gz"
    armhf.sha256 = "189193cc015a1cd026e19c9beeb55dc99183ece13b556d5d2ddb18bb6f6684c8"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.armhf = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
