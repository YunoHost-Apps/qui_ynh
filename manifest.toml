#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "qui"
name = "Qui"
description.en = "qBittorrent web UI"
description.fr = "Interface utilisateur Web qBittorrent"

version = "1.29.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-2.0"
website = "https://getqui.com/"
admindoc = "https://getqui.com/docs/intro"
code = "https://github.com/autobrr/qui"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
     in_subdir = false
    amd64.url = "https://github.com/autobrr/qui/releases/download/v1.29.0/qui_1.29.0_linux_x86_64.tar.gz"
    amd64.sha256 = "154f80c65e2ac8ca556d483d37532a963b3a2fbf09c8a91d3bc53eb6a47c363e"
    arm64.url = "https://github.com/autobrr/qui/releases/download/v1.29.0/qui_1.29.0_linux_arm64.tar.gz"
    arm64.sha256 = "560ee52ebdbcfcf439ff10e9fa988d1c8520b3055a7faada20b3c31f9843e4ca"
    armhf.url = "https://github.com/autobrr/qui/releases/download/v1.29.0/qui_1.29.0_linux_x86_64.tar.gz"
    armhf.sha256 = "154f80c65e2ac8ca556d483d37532a963b3a2fbf09c8a91d3bc53eb6a47c363e"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.armhf = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
