#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "qui"
name = "Qui"
description.en = "qBittorrent web UI"
description.fr = "Interface utilisateur Web qBittorrent"

version = "1.16.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "GPL-2.0"
website = "https://getqui.com/"
admindoc = "https://getqui.com/docs/intro"
code = "https://github.com/autobrr/qui"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
     in_subdir = false
    amd64.url = "https://github.com/autobrr/qui/releases/download/v1.16.0/qui_1.16.0_linux_x86_64.tar.gz"
    amd64.sha256 = "2a20e233f945aaaca2d360c66e309ff232d2e19e4f35a81b7892b1e606a944bf"
    arm64.url = "https://github.com/autobrr/qui/releases/download/v1.16.0/qui_1.16.0_linux_arm64.tar.gz"
    arm64.sha256 = "76b5d767339f3f7de2f63f57cd8485c3bb233e2c13b9b1b0f5054c43c10a7404"
    armhf.url = "https://github.com/autobrr/qui/releases/download/v1.16.0/qui_1.16.0_linux_x86_64.tar.gz"
    armhf.sha256 = "2a20e233f945aaaca2d360c66e309ff232d2e19e4f35a81b7892b1e606a944bf"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.armhf = ".*_linux_x86_64.tar.gz"
    autoupdate.asset.arm64 = ".*_linux_arm64.tar.gz"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
